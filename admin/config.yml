backend:
  name: github
  repo: sojung-moon/sojung-moon.github.io
  branch: main

locale: ko

# 포스터 이미지는 assets/posters 에 저장됩니다.
media_folder: /assets/posters
public_folder: /assets/posters

collections:
  - name: posts
    label: 기록
    label_singular: 기록
    folder: /_posts
    create: true
    extension: md
    format: frontmatter
    # Jekyll은 파일명 앞의 날짜가 필요합니다. 날짜 뒤는 랜덤 문자열 → 글 주소가 /post/랜덤문자/ 가 됩니다.
    slug: "{{year}}-{{month}}-{{day}}-{{uuid_short}}"
    summary: "{{title}} · {{categories}}"
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 원제, name: original_title, widget: string, required: false }
      - label: 카테고리
        name: categories
        widget: select
        options: ["영화", "시리즈"]
        default: "영화"
      - { label: 태그, name: tags, widget: list, required: false, hint: "장르, 감독 등 (예: 스릴러)" }
      - { label: 포스터, name: thumbnail, widget: image, required: false, hint: "비워 두면 제목·연도로 포스터를 자동으로 가져옵니다 (1~2분 소요)" }
      - { label: 개봉(방영) 연도, name: year, widget: number, value_type: int, min: 1900, max: 2100 }
      - label: 시청 연도
        name: watched
        widget: number
        value_type: int
        min: 1900
        max: 2100
        required: false
        hint: "본 연도만 입력 (예: 2025). 비워 두면 글을 저장한 해로 정렬·통계에 쓰입니다"
      - { label: 별점, name: rating, widget: number, value_type: float, min: 0, max: 5, step: 0.5, hint: "0.5 단위, 5점 만점" }
      - { label: 본 곳, name: platform, widget: string, required: false, hint: "예: 넷플릭스, 극장" }
      - label: 상태
        name: status
        widget: select
        options: ["완료", "시청중", "하차"]
        default: "완료"
      - { label: 다시 봄, name: rewatch, widget: boolean, default: false }
      - { label: 전체 화수, name: episodes, widget: number, value_type: int, required: false, hint: "시리즈만 입력" }
      - { label: 현재까지 본 화수, name: progress, widget: number, value_type: int, required: false, hint: "시청중일 때만 입력" }
      - { label: 감상, name: body, widget: richtext, required: false }

  - name: quotes
    label: Book
    files:
      - name: quotes
        label: 책 구절 모음
        file: /_data/quotes.yml
        fields:
          - label: 구절 목록
            label_singular: 구절
            name: items
            widget: list
            summary: "{{fields.title}} · {{fields.author}}"
            fields:
              - { label: 책 제목, name: title, widget: string }
              - { label: 저자, name: author, widget: string, required: false }
              - { label: 구절, name: quote, widget: text }
