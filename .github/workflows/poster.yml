name: fill-posters

# _posts 의 글이 올라오면, 포스터(thumbnail)가 비어 있는 글에 TMDB 포스터를 자동으로 채웁니다.
on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill missing posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 _scripts/fill_posters.py

      - name: Commit and rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "바뀐 글이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "chore: 포스터 자동 입력"
          git pull --rebase origin main
          git push
          # GITHUB_TOKEN 으로 push 한 커밋은 Pages 빌드를 자동으로 시작하지 않을 수 있어, 직접 요청합니다.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages 빌드 요청 실패(무시)"
