{%- assign p = include.post -%}
{%- assign wy = p.watched | append: "" | slice: 0, 4 -%}
{%- if wy == blank -%}{%- assign wy = p.date | date: "%Y" -%}{%- endif -%}
<a class="poster" href="{{ p.url | relative_url }}"
   data-title="{{ p.title | escape }}"
   data-rating="{{ p.rating | default: 0 }}"
   data-date="{{ wy }}-{{ p.date | date: '%Y%m%d' }}">
  <img src="{% include thumb.html post=p %}" alt="{{ p.title | escape }}" loading="lazy">
  <span class="info">
    <b>{{ p.title }}</b>
    <small>{% if p.rating %}★ {{ p.rating }}{% endif %}{% if p.rating and p.year %} · {% endif %}{{ p.year }}</small>
  </span>
</a>
