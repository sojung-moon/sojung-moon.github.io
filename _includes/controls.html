<div class="controls" data-controls>
  <div class="chips" role="group" aria-label="상태 필터">
    <button type="button" class="chip on" data-status="">전체</button>
    <button type="button" class="chip" data-status="완료">완료</button>
    <button type="button" class="chip" data-status="시청중">시청중</button>
    <button type="button" class="chip" data-status="하차">하차</button>
  </div>
  {%- if include.sort -%}
  <select class="sort" aria-label="정렬">
    <option value="rating">별점 높은순</option>
    <option value="title">제목순</option>
  </select>
  {%- endif -%}
</div>
