items:
  - title: 숨
    author: 테드 창
    quote: 그 무엇도 과거를 지울 수는 없습니다. 다만 회개가 있고, 속죄가 있고, 용서가 있습니다. 단지 그뿐이지만, 그것으로 충분합니다.
  - title: 숨
    author: 테드 창
    quote: |-
      탐험자들은 우리의 거리를 거닐며 우리의 미동 없는 몸을 보고, 우리가 소유했던 물건들을 살피고, 우리가 살았던 삶을 상상할 것이다.
      그런 연유로 나는 이 기록을 남긴다. 이 기록을 읽는 당신이 바로 그런 탐험자이기를 희망한다. 이 동판을 발견해 그 표면에 각인된 글을 당신이 해독해주기를 희망한다. 그러면 당신의 뇌가 일찍이 내 뇌를 움직였던 공기에 의해 작동하든 그렇지 않든, 내 글을 읽는 행위를 통해, 당신의 사고를 형성하는 패턴들은 한때 나의 사고를 형성했던 패턴들을 복제하게 된다. 그리고 그런 식으로 나는 다시 살게 될 것이다. 당신을 통해서.
      당신의 동료 탐험자들은 우리가 남긴 다른 책들을 발견해 읽게 될 것이다. 그리고 당신들의 협동적 사고를 통해 우리 문명 전체는 다시 살게 될 것이다. (중략) 다음번에 당신들을 에워싼 이 얼어붙은 세계를 보게 된다면 이런 것들을 떠올려주시길. 그러면 우리 세계는 당신들의 마음속에서 되살아나 다시 생명력을 얻게 될 것이다.
  - title: 숨
    author: 테드 창
    quote: 당신이 존재한다는 사실의 경이로움에 관해 묵상하고, 당신이 그럴 수 있다는 사실을 기뻐하라. 당신에게 이런 말을 할 권리가 내게는 있다고 느낀다. 지금 이 글을 각인하면서, 내가 바로 그렇게 묵상하고, 기뻐하고 있기 때문이다.
  - title: 숨
    author: 테드 창
    quote: 그러나 나의 메시지의 요지는 다음과 같다. 자유의지가 있는 것처럼 행동하라. 설령 사실이 아님을 알고 있어도, 스스로 내리는 선택에 의미가 있는 듯이 행동하는 것이 가장 중요하다. 무엇이 현실인지는 중요하지 않다. 정말로 중요한 것은 당신이 무엇을 믿느냐이며, 이 거짓말을 믿는 것이야말로 깨어 있는 혼수상태에 빠지는 것을 피할 수 있는 유일한 방법이다. 문명의 존속은 이제 자기기만에 달려 있다. 어쩌면 줄곧 그래 왔는지도 모른다.
