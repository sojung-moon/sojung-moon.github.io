items:
  - title: 숨
    author: 테드 창
    quote: 그 무엇도 과거를 지울 수는 없습니다. 다만 회개가 있고, 속죄가 있고, 용서가 있습니다. 단지 그뿐이지만, 그것으로 충분합니다.
  - title: 숨
    author: 테드 창
    quote: |-
      탐험자들은 우리의 거리를 거닐며 우리의 미동 없는 몸을 보고, 우리가 소유했던 물건들을 살피고, 우리가 살았던 삶을 상상할 것이다.
      그런 연유로 나는 이 기록을 남긴다. 이 기록을 읽는 당신이 바로 그런 탐험자이기를 희망한다. 이 동판을 발견해 그 표면에 각인된 글을 당신이 해독해주기를 희망한다. 그러면 당신의 뇌가 일찍이 내 뇌를 움직였던 공기에 의해 작동하든 그렇지 않든, 내 글을 읽는 행위를 통해, 당신의 사고를 형성하는 패턴들은 한때 나의 사고를 형성했던 패턴들을 복제하게 된다. 그리고 그런 식으로 나는 다시 살게 될 것이다. 당신을 통해서.
      당신의 동료 탐험자들은 우리가 남긴 다른 책들을 발견해 읽게 될 것이다. 그리고 당신들의 협동적 사고를 통해 우리 문명 전체는 다시 살게 될 것이다. (중략) 다음번에 당신들을 에워싼 이 얼어붙은 세계를 보게 된다면 이런 것들을 떠올려주시길. 그러면 우리 세계는 당신들의 마음속에서 되살아나 다시 생명력을 얻게 될 것이다.
  - title: 숨
    author: 테드 창
    quote: 당신이 존재한다는 사실의 경이로움에 관해 묵상하고, 당신이 그럴 수 있다는 사실을 기뻐하라. 당신에게 이런 말을 할 권리가 내게는 있다고 느낀다. 지금 이 글을 각인하면서, 내가 바로 그렇게 묵상하고, 기뻐하고 있기 때문이다.
  - title: 숨
    author: 테드 창
    quote: 그러나 나의 메시지의 요지는 다음과 같다. 자유의지가 있는 것처럼 행동하라. 설령 사실이 아님을 알고 있어도, 스스로 내리는 선택에 의미가 있는 듯이 행동하는 것이 가장 중요하다. 무엇이 현실인지는 중요하지 않다. 정말로 중요한 것은 당신이 무엇을 믿느냐이며, 이 거짓말을 믿는 것이야말로 깨어 있는 혼수상태에 빠지는 것을 피할 수 있는 유일한 방법이다. 문명의 존속은 이제 자기기만에 달려 있다. 어쩌면 줄곧 그래 왔는지도 모른다.
  - title: 망명과 자긍심
    author: 일라이 클레어
    quote: 웃고 울고 이야기하자. 도둑맞은 몸과 더 이상은 여기 없는 몸에 관한 슬픈 이야기를 나누자. 잘못된 이미지와 우리를 고갈시키는 거짓말과 이루 말할 수 없는 폭력에 관한 분노케 하는 이야기를 나누자. 우리 몸을 되찾고 세상을 바꾸는 일에 관한 무모하고 대담한 이야기를 나누자.
  - title: 스패로
    author: 메리 도리아 러셀
    quote: "'언제나 그리고 영원히'라니! 그건 인간의 단어가 아니야. 심지어 바위조차 언제나 그리고 영원히 한결같지는 못해."
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 그리고 모든 일이 다시 정상으로 돌아왔다. 소행성 안에서, 알파 센타우리 위에서, 신의 계시를 찾아가며.
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 냄새는 변덕스러우면서도 오래가고, 맛보다 먼저 오며, 각성의 도구, 친밀함과 기억의 정수라고…… 냄새는 세상의 영혼이라고, 흘라빈 키서리는 노래했다.
  - title: 스패로
    author: 메리 도리아 러셀
    quote: '"내가 한번은 앤 에드워즈에게 뭐라고 했는지 압니까? 신은 ''무엇''이 아니라 ''왜''에 있다고 했습니다." 그는 이제 아무도 쳐다보려 하지 않았다. 그저 창밖을 내다보며 등을 보인 채로 서 있었다.'
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 우리 삶에는 특별한 순간들이 있다고. 탄생이나 죽음과 직면하는 순간, 혹은 사람의 본성이나 사랑이 완연한 모습을 드러내는 아름다운 순간, 혹은 끔찍하게 외로운 순간이. 그런 순간이면 성스럽고 놀라운 깨달음이 우리를 찾아온다. 그런 깨달음은 깊은 내면의 고요함일 수도 있고, 갑작스러운 감정의 분출일 수도 있다. 어떤 계기로 아득히 먼 곳에서 비롯하거나, 음악이나 혹은 잠든 아이를 통해 우리 내면에서 우러날 수도 있다. 우리가 그런 순간에 마음을 열면 일관되고 충만한 창조 그 자체를 발견할 수 있다. 그리고 우리가 그런 순간에서 돌아오면 우리의 마음은 보다 숭고한 진실에 대한 믿음을 간직하고자 말로써 그와 같은 깨달음을 영원히 보존하기를 갈망한다.
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 우리 종족은 그런 순간에 느끼는 진실에 이름을 붙이고자 했다고. 우리는 그 진실을 신이라고 부른다. 그리고 그런 깨달음을 불멸의 시로 표현했을 때, 우리는 그것을 기도라고 부른다. 우리는 당신의 노래를 듣고 당신 역시 그런 진실의 순간들에 이름을 붙이고 보존할 수 있는 언어를 찾아냈다는 사실을 알았다.
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 나는 당신의 시를 배우고 어쩌면 당신에게 우리의 시를 가르치기 위해 여기에 왔다고.
  - title: 스패로
    author: 메리 도리아 러셀
    quote: "'이 순간은 수 세대에 걸쳐 노래로 불리리라.'"
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 영혼의 밤이 정확히 얼마나 어두워질 수 있는지 알고 싶소?
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 그리고 난, 나는 내가 이해하고 있다고 생각했소. 그게 신에게 다가가는 길이고, 나는 그 사실을 이해한다고 생각했소. 존, 자신의 영혼이 불로 된 공처럼 느껴지는 순간이 있소. 그리고 무엇에나 또 누구에게나 똑같이 가서 닿는 순간이 말이오. 난 이해하고 있다고 생각했소.
  - title: 스패로
    author: 메리 도리아 러셀
    quote: 풀이 무성하고 탁 트인 안뜰 너머로, 중세의 성채와 어지럽게 널려 있는 바위들, 잘 다듬어진 정원과 뒤틀린 나무들이 보였다. 위대하고 아름다운 시간의 흔적이 배어 있는 풍경이었다.
