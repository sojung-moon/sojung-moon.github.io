---
layout: default
---
<section class="card section">
  <div class="sec-head">
    <h1>Recently watched</h1>
    <span class="count">{{ site.posts.size }}</span>
  </div>
  {% if paginator.posts.size > 0 %}
  <div class="grid home-grid">
    {% for p in paginator.posts %}{% include post-card.html post=p %}{% endfor %}
  </div>
  {% else %}
  <p class="empty">아직 기록이 없어요. <code>_posts</code>에 첫 글을 추가해 보세요.</p>
  {% endif %}
</section>
